name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install build==1.2.2.post1
      - run: python -m build
      - run: python tools/verify_install.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: rustup show
      - run: python tools/check_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: differential-${{ matrix.os }}
          path: |
            target/differential/
            target/fuzz-smoke/
            target/differential-extended/
            target/fuzz-extended/
            target/preview-gate/
          if-no-files-found: ignore
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: docker build -t project-f:ci .
      - run: python tools/verify_container.py project-f:ci
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: rustup show
      - run: python tools/package_native.py
      - run: python tools/verify_native.py release-dist/native/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: release-dist/native/*
          if-no-files-found: error
