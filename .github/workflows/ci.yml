name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[evidence]"
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install build==1.2.2.post1
      - run: python tools/check_release_source.py --python-version 0.2.0a1 --native-version 0.2.0-alpha.1 --license-id MIT
      - run: python -m build
      - run: python tools/verify_python_release.py dist/*.whl dist/*.tar.gz --expected-version 0.2.0a1 --license-id MIT --legal-dir .
      - run: python tools/verify_install.py dist/*.whl --evidence
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: rustup show
      - run: python tools/check_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: differential-${{ matrix.os }}
          path: |
            target/differential/
            target/fuzz-smoke/
            target/differential-extended/
            target/fuzz-extended/
            target/preview-gate/
          if-no-files-found: ignore
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: docker build -t project-f:ci .
      - run: python tools/verify_container.py project-f:ci
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: rustup show
      - run: python tools/package_native.py
      - run: python tools/verify_native.py release-dist/native/*.tar.gz --release --expected-commit "${{ github.sha }}" --expected-version 0.2.0-alpha.1 --license-id MIT
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: release-dist/native/*
          if-no-files-found: error

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: foresee_test
          POSTGRES_USER: foresee
          POSTGRES_PASSWORD: conformance-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foresee -d foresee_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      FORESEE_TEST_POSTGRES_DSN: postgresql://foresee:conformance-only@localhost:5432/foresee_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install ".[postgres]"
      - run: python -m unittest discover -s integration -v
      - run: python -m pip install build==1.2.2.post1
      - run: python -m build --wheel
      - run: python tools/verify_install.py dist/*.whl --postgres

  postgres-faults:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install ".[postgres]"
      - run: python tools/check_postgres_faults.py
